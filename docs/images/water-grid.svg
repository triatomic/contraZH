<rect x="20" y="360" width="700" height="60" fill="#fff"/>
<text x="20" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#333" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">Square levels, each with cells twice the size of the one inside it, so the swell is fine close by and coarse far off.</text>
<text x="20" y="394" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#333" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">Each level snaps to its own world lattice, so vertices stay on fixed world points as the camera moves.</text>
<text x="20" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#333" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">The water mask cuts the grid to each lake at the drawn level (solid). Other levels get their own draw (dashed).</text>
<text x="20" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#333" font-weight="bold" text-anchor="start" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">Swell grid, seen from above</text>
